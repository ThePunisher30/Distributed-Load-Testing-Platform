name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway Postgres so the backend store tests (real SQL) run in CI. The
    # tests bootstrap their own schema and read TEST_DATABASE_URL; without it they
    # skip, so this makes them actually execute.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dltp
          POSTGRES_PASSWORD: dltp
          POSTGRES_DB: dltp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dltp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: backend - build, vet, test
        working-directory: backend
        env:
          TEST_DATABASE_URL: "postgres://dltp:dltp@localhost:5432/dltp_test?sslmode=disable"
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: worker - build, vet, test (race)
        working-directory: worker
        run: |
          go build ./...
          go vet ./...
          go test -race ./...

      - name: target - build, vet
        working-directory: target
        run: |
          go build ./...
          go vet ./...

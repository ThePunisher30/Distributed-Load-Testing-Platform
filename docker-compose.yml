# Local infrastructure for the Distributed Load Testing Platform.
#
# Brings up the whole system with one command:
#   docker compose up --build
#
# Services reach each other by service name on the default compose network
# (e.g. the backend connects to "postgres", the worker calls "backend").

services:
  postgres:
    image: postgres:16-alpine
    container_name: dltp-postgres
    environment:
      POSTGRES_USER: dltp
      POSTGRES_PASSWORD: dltp
      POSTGRES_DB: dltp
    ports:
      # Exposed on the host so we can connect from local tools and psql.
      - "5432:5432"
    volumes:
      # Persist database data across container restarts.
      - postgres_data:/var/lib/postgresql/data
      # Any .sql file here runs automatically the FIRST time the data volume
      # is created (empty volume only). This bootstraps our schema.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dltp -d dltp"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: dltp-backend
    environment:
      # Host is the "postgres" service name, not localhost, inside the network.
      DATABASE_URL: postgres://dltp:dltp@postgres:5432/dltp?sslmode=disable
      BACKEND_ADDR: ":8080"
      REDIS_ADDR: redis:6379
    ports:
      # Exposed so you can POST test runs from the host.
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /health pings the DB, so a healthy backend also means the DB is reachable.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build: ./worker
    container_name: dltp-worker
    environment:
      # Reach the backend and broker by service name.
      BACKEND_URL: http://backend:8080
      REDIS_ADDR: redis:6379
      # Reclaim a message unacked this long (short here since demo runs are brief;
      # in production this must exceed the longest possible job).
      RECLAIM_MIN_IDLE: 10s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  target:
    build: ./target
    container_name: dltp-target
    ports:
      # Exposed for direct testing; the worker reaches it as http://target:8081.
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Phase 2: the message broker. The backend publishes jobs to a Redis stream;
  # workers consume them via a consumer group instead of polling the backend.
  redis:
    image: redis:7-alpine
    container_name: dltp-redis
    ports:
      # Exposed so we can inspect the stream with redis-cli from the host.
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:

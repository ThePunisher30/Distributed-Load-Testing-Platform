# Serves the built SPA and reverse-proxies the API, so the browser talks to one
# origin (no CORS) and client-side routes fall back to index.html.
server {
    listen 80;

    # /api/test-runs -> http://backend:8080/test-runs (the trailing slash on
    # proxy_pass strips the /api/ prefix).
    location /api/ {
        proxy_pass http://backend:8080/;
    }

    # Static SPA assets, with a fallback to index.html so client-side routes
    # (e.g. /runs/42) resolve on a full-page load.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
